name: JEVGuard Docker

on:
  push:
    branches:
      - main

jobs:
  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t jevguard-cloud:test \
            .

      - name: Start container
        run: |
          docker run \
            -d \
            --name jevguard-test \
            -p 8000:8000 \
            -e GROQ_API_KEY=test-key \
            -e TYPESAFE_API_KEY=test-key \
            jevguard-cloud:test

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          curl --fail http://localhost:8000/health

      - name: Container logs
        if: always()
        run: |
          docker logs jevguard-test

      - name: Stop container
        if: always()
        run: |
          docker rm -f jevguard-test