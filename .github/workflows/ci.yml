name: JEVGuard CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  test:

    name: Test JEVGuard

    runs-on: ubuntu-latest

    steps:

      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Check Python syntax
      - name: Syntax check
        run: |
          python -m compileall app

      # 5. Run tests
      - name: Run tests
        run: |
          pytest -v